syntax = "proto3";

// Client <-> cluster contract (Member 4 proposal).
// Shared by three projects:
//   - client     : calls ClusterDiscovery and CoordinatorJobService
//   - bootstrap  : implements ClusterDiscovery
//   - worker     : the elected coordinator implements CoordinatorJobService
// Kept in its own package so it never clashes with worker.proto.

package distrilab.client;

option java_multiple_files = true;
option java_package = "common.grpc.client";
option java_outer_classname = "ClientServiceProto";

enum ClientJobType {
    CLIENT_JOB_TYPE_UNSPECIFIED = 0;
    MAX = 1;
    PRIMESUM = 2;
    PRIMECOUNT = 3;
}

// One job submitted by a client.
message JobSubmission {
    // Generated by the client. Unchanged when the client resubmits the same
    // job after a coordinator failure, so the coordinator can recognise it.
    string job_id = 1;
    ClientJobType job_type = 2;
    repeated int64 numbers = 3;   // MAX, PRIMECOUNT
    int64 range_start = 4;        // PRIMESUM
    int64 range_end = 5;          // PRIMESUM
    string client_id = 6;         // for logging only
}

// Progress of one worker's sub-task, in real work units
// (numbers checked / range values evaluated), never time-based.
message WorkerTaskProgress {
    int32 worker_id = 1;
    string task_id = 2;
    int64 units_completed = 3;
    int64 total_units = 4;
    string status = 5;            // e.g. PROCESSING, COMPLETED, FAILED, REASSIGNED
}

// Streamed from the coordinator to the client while a job runs.
message JobProgress {
    enum JobState {
        JOB_STATE_UNSPECIFIED = 0;
        RUNNING = 1;
        COMPLETED = 2;
        FAILED = 3;
    }
    string job_id = 1;
    JobState state = 2;
    // Latest progress for the sub-tasks that changed (or all of them).
    // The client keeps the newest report per task_id.
    repeated WorkerTaskProgress workers = 3;
    double overall_percentage = 4;   // informational; client recomputes from units
    int64 result_value = 5;          // set when state = COMPLETED
    string error_message = 6;        // set when state = FAILED
    bool retryable = 7;              // FAILED only: true if resubmitting may succeed
    int32 coordinator_id = 8;
}

message StatusRequest {
    string client_id = 1;
}

message CoordinatorStatus {
    int32 coordinator_id = 1;
    int32 term = 2;
    int32 active_workers = 3;
    int32 jobs_in_term = 4;
}

// Hosted by the elected coordinator.
service CoordinatorJobService {
    // Server streaming: one request, then a stream of progress messages.
    // The last message has state COMPLETED or FAILED, then the stream closes.
    rpc SubmitJob(JobSubmission) returns (stream JobProgress);

    // Used by the client's "Test Connection" button.
    rpc GetStatus(StatusRequest) returns (CoordinatorStatus);
}

message CoordinatorQuery {
    string client_id = 1;
}

message CoordinatorEndpoint {
    bool available = 1;           // false while no coordinator is elected
    string host = 2;
    int32 port = 3;               // coordinator's gRPC port
    int32 coordinator_id = 4;
    int32 term = 5;
}

// Hosted by the Bootstrap node: tells clients where the current coordinator is.
service ClusterDiscovery {
    rpc GetCoordinator(CoordinatorQuery) returns (CoordinatorEndpoint);
}
