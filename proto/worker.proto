syntax = "proto3";

package distrilab;

option java_multiple_files = true;
option java_package = "common.grpc";
option java_outer_classname = "WorkerServiceProto";

// Supported computation types ported from A1
enum JobTypeProto {
    JOB_TYPE_UNSPECIFIED = 0;
    MAX = 1;
    PRIMESUM = 2;
    PRIMECOUNT = 3;
}

// Request dispatched from Coordinator to Worker
message TaskDispatchRequest {
    string job_id = 1;
    string task_id = 2;
    JobTypeProto job_type = 3;
    
    // For MAX and PRIMECOUNT (list-based partitioning)
    repeated int64 data_chunk = 4;
    
    // For PRIMESUM (range-based partitioning)
    int64 range_start = 5;
    int64 range_end = 6;

    // Both zero means legacy; new assignments use positive terms and attempt 1.
    // Retries increment attempt but keep job_id/task_id; duplicate sends keep it.
    int32 attempt = 7;
    int32 coordinator_term = 8;
}

// Real-time progress update event streamed from Worker to Coordinator
message TaskProgressUpdate {
    string job_id = 1;
    string task_id = 2;
    int32 worker_id = 3;
    
    // Progress metric strictly calculated from actual processed items/ranges
    double progress_percentage = 4; // e.g. 0.0 to 100.0
    int64 units_completed = 5;      // items scanned or numbers evaluated so far
    int64 total_units = 6;          // total chunk size or range span
    string status_message = 7;      // "PROCESSING", "COMPLETED", "FAILED"
    int64 timestamp_ms = 8;

    // Present once at termination; absent on ordinary progress updates.
    // IDs, attempt and term must match the enclosing update.
    TaskResultResponse final_result = 9;
    int32 attempt = 10;
    int32 coordinator_term = 11;
}

// Final result returned when task execution completes
message TaskResultResponse {
    string job_id = 1;
    string task_id = 2;
    int32 worker_id = 3;
    bool success = 4;
    int64 result_value = 5;
    string error_message = 6;
    int64 execution_time_ms = 7;

    // Echo the dispatch identity; schedulers reject stale attempts/terms.
    int32 attempt = 8;
    int32 coordinator_term = 9;
    // Cancellation requires success=false; otherwise success=false means failure.
    bool cancelled = 10;
}

// Health check / Heartbeat request (used by Coordinator to detect active, slow, dead workers)
message HeartbeatRequest {
    int32 coordinator_id = 1;
    int64 timestamp_ms = 2;
}

// Health check / Heartbeat response from Worker
message HeartbeatResponse {
    int32 worker_id = 1;
    enum WorkerStatus {
        IDLE = 0;
        BUSY = 1;
        DRAINING = 2;
    }
    WorkerStatus status = 2;
    int32 active_tasks_count = 3;
    int64 timestamp_ms = 4;
    int32 current_term = 5;
}

// Cancellation / Preemption request (e.g. if a task is reassigned or job aborted)
message CancelTaskRequest {
    string job_id = 1;
    string task_id = 2;
    string reason = 3;

    // Target this exact assignment so a delayed cancellation cannot stop its retry.
    // Zero attempt/term retains legacy cancellation behaviour.
    int32 attempt = 4;
    int32 coordinator_term = 5;
}

message CancelTaskResponse {
    string task_id = 1;
    bool cancelled = 2;
    string message = 3;

    // Echo the cancellation request, even when the assignment was not found.
    int32 attempt = 4;
    int32 coordinator_term = 5;
}

// gRPC Service hosted by each Worker Node
service WorkerService {
    // 1. Coordinator dispatches a task; Worker streams back real-time progress and finishes with the final result
    rpc ExecuteTaskStream(TaskDispatchRequest) returns (stream TaskProgressUpdate);

    // 2. Unary task execution option (if Coordinator prefers unary dispatch with separate progress stream or callback)
    rpc ExecuteTask(TaskDispatchRequest) returns (TaskResultResponse);

    // 3. Coordinator checks worker liveness / load (heartbeat hook for failure detection)
    rpc Ping(HeartbeatRequest) returns (HeartbeatResponse);

    // 4. Coordinator cancels a running task (fault tolerance & preemption hook)
    rpc CancelTask(CancelTaskRequest) returns (CancelTaskResponse);
}


message CoordinatorElectionRequest {
    int32 candidate_id = 1;
    int32 candidate_jac = 2;
    int32 term = 3;
    string message_id = 4;
}

message CoordinatorElectionResponse {
    bool accepted = 1;
    int32 best_candidate_id = 2;
    int32 best_candidate_jac = 3;
    int32 term = 4;
    string message = 5;
}

message CoordinatorElectionAnnouncement {
    int32 coordinator_id = 1;
    int32 coordinator_jac = 2;
    int32 term = 3;
}

message CoordinatorStateRequest {
    int32 requesting_coordinator_id = 1;
    int32 term = 2;
}

message TaskCheckpoint {
    string job_id = 1;
    string task_id = 2;
    string status = 3;
    int32 assigned_worker_id = 4;
    bool has_result = 5;
    int64 result_value = 6;
}

message CoordinatorStateResponse {
    int32 coordinator_id = 1;
    int32 term = 2;
    repeated TaskCheckpoint tasks = 3;
}

service CoordinatorElectionService {
    rpc StartElection(CoordinatorElectionRequest) returns (CoordinatorElectionResponse);
    rpc AnnounceCoordinator(CoordinatorElectionAnnouncement)
        returns (CoordinatorElectionResponse);
    rpc GetCoordinatorState(CoordinatorStateRequest)
        returns (CoordinatorStateResponse);
}
